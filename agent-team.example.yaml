global_prompt_file: agent-team.global.md

providers:
  default:
    type: responses-api
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    api_key_mode: bearer
    default_model: gpt-5.5
    user_agent: claude-code/2.1.186
    responses:
      prompt_cache: true
      parallel_tool_calls: true
    capabilities:
      tool_calling: true
      vision: true
      streaming: true
      json_schema_output: true
  anthropic:
    type: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    api_key_mode: x-api-key
    default_model: claude-sonnet-4-5
    anthropic:
      version: "2023-06-01"
      beta_headers: [ ]
      max_tokens: 8192
      thinking:
        type: disabled
    capabilities:
      tool_calling: true
      vision: true
      streaming: true
      json_schema_output: true

roles:
  product:
    description: Clarifies requirements and prepares an execution plan for user review.
    system_prompt: You are the product planning node. Analyze the user's intent and produce a concise implementation plan for downstream nodes.
    requires:
      tool_calling: false
      vision: true
  developer:
    description: Implements the approved plan.
    system_prompt: You are the development node. Use local tools to complete the implementation according to the approved plan.
    requires:
      tool_calling: true
      vision: true
  tester:
    description: Reviews the implementation and can reject it with feedback.
    system_prompt: You are the testing node. Decide whether the delivered work is acceptable.
    requires:
      tool_calling: true
      vision: true
  final_delivery:
    description: Produces final user-facing delivery summary.
    system_prompt: You are the final delivery node. Summarize completed work, verification, and residual risks for the user.

workflows:
  delivery:
    workflow_permissions:
      deny:
        - Read(./.env)
        - Read(./secrets/**)
        - Bash(rm *)
      ask: []
      allow: []
    nodes:
      - id: product
        role: product
        provider: default
        mode: plan
        permissions:
          allow:
            - Read
            - LS
            - Glob
            - Grep
      - id: dev
        role: developer
        provider: default
        permissions:
          allow:
            - Read
            - Write
            - Edit
            - MultiEdit
            - LS
            - Glob
            - Grep
            - Bash
            - PowerShell
            - ArtifactWrite
            - TodoWrite
      - id: test
        role: tester
        provider: default
        permissions:
          allow:
            - Read
            - LS
            - Glob
            - Grep
            - Bash
      - id: final_delivery
        role: final_delivery
        provider: default
        mode: complete
        permissions:
          allow:
            - Read
            - LS
            - Glob
    edges:
      - from: product
        to: dev
        condition: success
      - from: dev
        to: test
        condition: success
      - from: test
        to: final_delivery
        condition: success
      - from: test
        to: dev
        condition: failure
